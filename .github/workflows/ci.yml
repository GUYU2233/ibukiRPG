name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: build / vet / test / lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  windows:
    name: build / test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          go build ./...
          go build -o build/bin/ibukirpg.exe ./cmd/cli
          go build -o build/bin/ibukirpg-server.exe ./cmd/server
      - name: Test
        run: go test -count=1 ./...
