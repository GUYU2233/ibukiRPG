name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: build / vet / test / eval / lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: make build
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Eval (recorded transport, offline resolver, narrative guard)
        run: make eval
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  windows:
    name: build / test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/bin | Out-Null
          go build ./...
          go build -ldflags "-s -w -X github.com/GUYU2233/ibukiRPG/internal/buildinfo.Version=ci -X github.com/GUYU2233/ibukiRPG/internal/buildinfo.Commit=$env:GITHUB_SHA" -o build/bin/ibukirpg.exe ./cmd/cli
          go build -ldflags "-s -w -X github.com/GUYU2233/ibukiRPG/internal/buildinfo.Version=ci -X github.com/GUYU2233/ibukiRPG/internal/buildinfo.Commit=$env:GITHUB_SHA" -o build/bin/ibukirpg-server.exe ./cmd/server
      - name: Test
        run: go test -count=1 ./...

  android:
    name: android (aar + llama.cpp native + apk + unit/screenshot tests)
    runs-on: ubuntu-latest
    env:
      # 与 android/app/build.gradle.kts 中的 ndkVersion / cmake version 保持一致
      IBUKI_NDK: 27.3.13750724
      IBUKI_CMAKE: 3.31.6
      # 发布密钥证书的 SHA-256（公开信息）；CI 用 apksigner 校验 release APK 必须由该证书签名
      EXPECTED_CERT_SHA256: 5a9ac40d7ed48d05e2a1e1b7f989fe100f82b886a9101feb166ea71ed2323339
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install gomobile (version pinned by go.mod)
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Cache NDK + CMake
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.IBUKI_NDK }}
            ${{ env.ANDROID_HOME }}/cmake/${{ env.IBUKI_CMAKE }}
          key: android-sdk-ndk${{ env.IBUKI_NDK }}-cmake${{ env.IBUKI_CMAKE }}
      - name: Install NDK + CMake
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${IBUKI_NDK}" "cmake;${IBUKI_CMAKE}" > /dev/null
      - name: Cache llama.cpp source + native build
        uses: actions/cache@v4
        with:
          path: |
            android/.llama-cache
            android/app/.cxx
          key: llama-${{ hashFiles('android/app/src/main/cpp/**', 'android/app/build.gradle.kts') }}
          restore-keys: llama-
      - name: Build AAR
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${IBUKI_NDK}"
          gomobile init
          make android-aar
      - name: Assemble debug APK (with llama.cpp) + JVM unit / screenshot tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Check native libraries and APK size
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/debug/*.apk)
          unzip -l "$apk" | grep 'lib/' | tee native-libs.txt
          for lib in libibuki_llama.so libllama.so libggml.so libggml-base.so libc++_shared.so libgojni.so; do
            grep -q "lib/arm64-v8a/$lib" native-libs.txt || { echo "missing arm64-v8a/$lib"; exit 1; }
          done
          grep -q 'lib/arm64-v8a/libggml-cpu-' native-libs.txt || { echo "missing ggml cpu backends"; exit 1; }
          echo "### APK size: $(du -h "$apk" | cut -f1) ($(basename "$apk"))" >> "$GITHUB_STEP_SUMMARY"
      - name: Check 16 KB page alignment (debug APK)
        run: tools/check-apk-alignment.sh android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ibukiRPG-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # ---- 发布签名：只在本仓库的 push / workflow_dispatch 上运行，绝不在 pull_request（含 fork）上运行 ----
      - name: Decode release keystore
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::release signing secrets are not available; skipping signed release APK"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ks="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          chmod 600 "$ks"
          echo "ANDROID_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Require release signing for tag builds
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.available != 'true'
        run: |
          echo "::error::tag builds must produce a release-signed APK, but signing secrets are missing"
          exit 1
      - name: Assemble release APK (R8 minified, release-signed)
        if: steps.signing.outputs.available == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify release signing certificate + 16 KB alignment
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/release.keystore"
          apk=$(ls android/app/build/outputs/apk/release/*.apk)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # 只输出证书 SHA-256 摘要（公开信息）
          digest=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "release certificate SHA-256: ${digest}"
          [ "$digest" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::certificate digest mismatch (expected ${EXPECTED_CERT_SHA256})"; exit 1; }
          tools/check-apk-alignment.sh "$apk"
          echo "### Release APK: $(basename "$apk") $(du -h "$apk" | cut -f1), cert SHA-256 ${digest}" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: ibukiRPG-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/*.png
          if-no-files-found: ignore

  release:
    name: package and publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build versioned CLI binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            name="ibukirpg-${VERSION}-${os}-${arch}${ext}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X github.com/GUYU2233/ibukiRPG/internal/buildinfo.Version=${VERSION} -X github.com/GUYU2233/ibukiRPG/internal/buildinfo.Commit=${COMMIT}" \
              -o "dist/${name}" ./cmd/cli
          done
      # 直接使用 android 任务构建并测试过的 APK（含 llama.cpp 原生库），不再重复构建
      - uses: actions/download-artifact@v4
        with:
          name: ibukiRPG-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: ibukiRPG-release-apk
          path: release-apk
      - name: Package Android APKs (release-signed + debug)
        env:
          EXPECTED_CERT_SHA256: 5a9ac40d7ed48d05e2a1e1b7f989fe100f82b886a9101feb166ea71ed2323339
        run: |
          set -euo pipefail
          cp release-apk/*.apk "dist/ibukiRPG-${GITHUB_REF_NAME}.apk"
          cp apk/*.apk "dist/ibukiRPG-${GITHUB_REF_NAME}-android-debug.apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          digest=$("$apksigner" verify --print-certs "dist/ibukiRPG-${GITHUB_REF_NAME}.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "release certificate SHA-256: ${digest}"
          [ "$digest" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::certificate digest mismatch"; exit 1; }
          tools/check-apk-alignment.sh "dist/ibukiRPG-${GITHUB_REF_NAME}.apk"
      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # rc / alpha / beta 标签发布为 Pre-release
          pre=""
          case "${GITHUB_REF_NAME}" in *rc*|*alpha*|*beta*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag $pre
