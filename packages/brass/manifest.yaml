version: 0.2.0
type: story
engine: ">=0.2.0"
tagline: 学徒机械师的第一场试炼——扳手、齿轮，和一台会呼吸的黄铜甲胄。
description: 锈钟镇的工匠行会每年只收一名学徒。你要在竞技场赢下两场试炼，再下到镇子底下，找出让钟楼停摆的怪物。世界不会等你：试炼日、集市和拾荒者的夜袭都按自己的日程发生。这是 format 3 开放世界格式的完整示例。
author: guyu2233
icon: precision_manufacturing
accent: "#9A6B2F"
tags: [战斗, 蒸汽朋克, 示例]
dependencies: []
start:
  location: brass:location/workshop
  day: 1
  time: "08:00"
  known: [brass:location/workshop, brass:location/plaza, brass:location/arena, brass:event/trial_day, "brass:character/orin#name", "brass:character/orin#identity"]
  intro: |
    锈钟镇的钟楼已经三天没有敲响了。
    你背着一只旧工具箱走进行会工坊，炉火把墙上的齿轮映得通红。行会长欧琳从一台拆开的甲胄后面探出头来：“学徒试炼今天开始。先去竞技场，赢了再说话。”
    ——你可以直接写下想做的事，也可以点开世界面板看看你目前知道些什么（大多数东西还是“未知”）。
