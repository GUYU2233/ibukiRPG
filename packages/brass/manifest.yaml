version: 0.1.0
type: story
engine: ">=0.1.1"
tagline: 学徒机械师的第一场试炼——扳手、齿轮，和一台会呼吸的黄铜甲胄。
description: 锈钟镇的工匠行会每年只收一名学徒。你要在竞技场赢下两场试炼，再下到镇子底下，找出让钟楼停摆的怪物。一个约 20 分钟的战斗小故事，也是战斗 / 成长 / 图鉴 / 关系网格式的示例。
author: guyu2233
