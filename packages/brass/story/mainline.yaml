thresholds: {mild: 35, heavy: 70}
style: 原创蒸汽朋克小镇；轻松、热血、带点机油味的幽默。
anchors:
  - id: trial
    title: 第一章 · 黄铜试炼
    objective: 在铁环竞技场赢下两场试炼。
    story: brass:story/trial
    locations: [brass:location/arena, brass:location/workshop, brass:location/plaza]
    budget_turns: 14
    nudges:
      - 竞技场方向传来一阵欢呼，有人在喊候选人的名字。
      - 小铆钉跑过来拽你的袖子：“试炼！你再不去，我的三个铜板就要输光啦！”
    nudge_effects:
      - effect: {type: npc_move, target: brass:character/rivet, values: {location: "{location.id}"}}
    return_text: 你深吸一口气，朝竞技场的方向走去。
  - id: sewer
    title: 第二章 · 钟楼下的怪声
    objective: 下到钟楼下水道，找出让钟楼停摆的东西。
    story: brass:story/sewer
    locations: [brass:location/sewer, brass:location/plaza, brass:location/workshop]
    budget_turns: 16
    nudges:
      - 头顶的钟楼又发出一声刺耳的摩擦声，震得窗玻璃嗡嗡作响。
      - 欧琳托人带话：“下水道的事，你打算拖到什么时候？”
deviant:
  - tag: violence
    weight: 15
    reason: 在镇上动粗
  - tag: fled
    weight: 6
    reason: 临阵脱逃
  - tag: stealth
    weight: 8
    reason: 偷偷摸摸
sandbox:
  templates:
    - goal: defeat
      title: 清理{location}的{enemy}
      objective: 有人抱怨{location}出没着{enemy}，去把它们清理掉。
      locations: [brass:location/sewer, brass:location/arena]
      enemies: [brass:enemy/clock_rat, brass:enemy/sentry, brass:enemy/scavenger]
      reward_xp: 60
      reward_gold: 15
    - goal: talk
      title: 给{npc}捎个话
      objective: 行会有话要带给{npc}，去找到他 / 她。
      npcs: [brass:character/orin, brass:character/tock, brass:character/rivet]
      reward_xp: 30
      reward_gold: 5
    - goal: reach
      title: 巡查{location}
      objective: 去{location}转一圈，看看有没有异常。
      locations: [brass:location/plaza, brass:location/arena, brass:location/sewer, brass:location/workshop]
      reward_xp: 25
