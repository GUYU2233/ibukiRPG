# 世界事件时间线（第 5 节）：世界按自己的日程运转，玩家可以加入、阻止、错过，或干脆不管。
events:
  - id: brass:event/trial_day
    title: 学徒试炼日
    summary: 行会在铁环竞技场举行一年一度的学徒试炼。候选人要连赢两场。
    importance: 3
    canon: major
    known: true
    window: {start: "D1 08:00", end: "D2 20:00"}
    location: brass:location/arena
    participants: [brass:character/orin, brass:character/tock]
    stages:
      - {id: open, at: "D1 09:00", text: 竞技场的铁门打开，看台上坐满了来看热闹的镇民。}
    hooks:
      - {id: cheer, label: 在看台上给候选人喝彩, tags: [join], minutes: 30, vars: {crowd: 1}}
    outcomes:
      - id: closed
        title: 试炼日结束
        default: true
        text: 行会收起了竞技场的旗子——今年的试炼日结束了。
  - id: brass:event/market
    title: 钟楼集市
    summary: 每隔一天，商贩们在钟楼广场摆摊，交换齿轮、燃料和小道消息。
    importance: 1
    canon: flavor
    window: {start: "D2 10:00", end: "D2 16:00"}
    location: brass:location/plaza
    rumor:
      - {at: "D1 18:00", where: [brass:location/workshop, brass:location/plaza], text: 听说明天广场有集市，煤车会顺路带来一批燃料罐。}
    hooks:
      - {id: haggle, label: 和小贩讨价还价, tags: [join], minutes: 20, vars: {deals: 1}}
    outcomes:
      - id: good_trade
        title: 集市热闹收场
        when: 'event.vars.deals > 0'
        text: 你和小贩谈成了一笔，集市散场时大家都挺高兴。
        effects:
          - effect: {type: item_add, values: {item: brass:item/fuel_can, qty: 1}}
      - id: quiet
        title: 集市照常散场
        default: true
        text: 集市照常散场，广场上只剩下推车压过的车辙。
  - id: brass:event/scavenger_raid
    title: 拾荒者夜袭钟楼
    summary: 拾荒者趁钟楼停摆，计划在夜里撬开钟楼底座，拆走铜齿轮。
    importance: 4
    canon: major
    pivotal: true
    window: {start: "D3 22:00", end: "D4 02:00"}
    location: brass:location/plaza
    participants: [brass:character/rivet]
    preconditions: '!("golem_down" in world.flags)'
    rumor:
      - {at: "D2 12:00", where: [brass:location/sewer, brass:location/plaza], text: 管道里有人在磨撬棍，说要“趁钟不响的时候拿点利息”。}
      - {at: "D3 08:00", where: [brass:location/arena], text: 托克说昨晚看见几个黑影在钟楼底座附近转悠。}
    stages:
      - {id: pry, at: "D3 23:00", text: 钟楼底座的检修门被撬开了一条缝。}
    hooks:
      - {id: warn_guild, label: 去工坊报信, tags: [disrupt], minutes: 15, vars: {guard: 2}}
      - {id: confront, label: 直接拦住拾荒者, tags: [disrupt, resolve], minutes: 10, vars: {guard: 3}}
      - {id: help_raid, label: 帮拾荒者望风, tags: [join], minutes: 30, vars: {loot: 2}}
    outcomes:
      - id: foiled
        title: 夜袭被挫败
        when: 'event.vars.guard >= 2'
        text: 行会的人提着灯冲进广场，拾荒者丢下撬棍四散而逃。
        effects:
          - effect: {type: relation, values: {from: brass:character/orin, to: player, trust: 5, reason: 及时报信挫败了夜袭}}
      - id: looted
        title: 钟楼的铜齿轮被拆走
        default: true
        text: 天亮时，人们发现钟楼底座空了一大块——两只铜齿轮不见了。
        effects:
          - effect: {type: flag_set, values: {flag: gears_stolen}}
  - id: brass:event/dock_strike
    title: 码头罢工
    summary: 码头工人抗议煤烟帮压价，在北码头罢工，驳船卸不了货，燃料开始涨价。
    importance: 2
    canon: minor
    window: {start: "D2 06:00", end: "D3 18:00"}
    location: brass:location/north_dock
    rumor:
      - {at: "D1 20:00", where: [brass:location/plaza, brass:location/workshop], text: 码头那边吵起来了，说煤烟帮又压了工钱。}
    hooks:
      - {id: mediate, label: 去码头调停, tags: [resolve], minutes: 40, vars: {calm: 2}}
      - {id: side_workers, label: 帮工人写请愿书, tags: [join], minutes: 30, vars: {calm: 1}}
    outcomes:
      - id: settled
        title: 罢工平息
        when: 'event.vars.calm >= 2'
        text: 工人们拿到了一半的欠薪，驳船重新开始卸货。
      - id: dragged
        title: 罢工不了了之
        default: true
        text: 罢工拖到最后，工人们饿着肚子回去上工，燃料价钱再没降下来。
        effects:
          - effect: {type: flag_set, values: {flag: fuel_expensive}}
  - id: brass:event/council_vote
    title: 议会投票
    summary: 钟楼议会投票决定修缮款交给行会还是码头。
    importance: 4
    canon: major
    known: true
    window: {start: "D4 09:00", end: "D4 12:00"}
    location: brass:location/plaza
    rumor:
      - {at: "D3 12:00", where: [brass:location/plaza], text: 有人看见议会代表进了三号仓，出来时口袋鼓鼓的。}
    hooks:
      - {id: speak, label: 在投票前替行会说话, tags: [join], minutes: 30, vars: {guild: 1}}
      - {id: expose, label: 当众揭穿收钱的代表, tags: [disrupt, resolve], minutes: 20, vars: {guild: 3}}
    outcomes:
      - id: guild_wins
        title: 修缮款交给行会
        when: 'event.vars.guild >= 2'
        text: 议会投票结束，修缮款交给了行会，钟楼重新敲响。
        effects:
          - effect: {type: flag_set, values: {flag: vote_exposed}}
      - id: dock_wins
        title: 修缮款流向码头
        default: true
        text: 投票结果出来了——修缮款给了码头。广场上一片嘘声。
  - id: brass:event/clock_stop
    title: 钟停之时
    summary: 煤烟帮约定的暗号——在钟楼停摆的夜里于北码头动手。
    importance: 5
    canon: major
    pivotal: true
    window: {start: "D4 21:00", end: "D5 01:00"}
    location: brass:location/north_dock
    participants: [brass:character/tock]
    rumor:
      - {at: "D3 18:00", where: [brass:location/plaza], text: 有人在广场散发传单：一只被齿轮咬住的手，“明晚，钟停之时”。}
    stages:
      - {id: oil, at: "D4 21:30", text: 三号仓外的煤油桶被人推倒了，油迹一路淌到木梁下。}
    hooks:
      - {id: warn_dock, label: 提醒码头工人离开仓库, tags: [disrupt], minutes: 20, vars: {saved: 1}}
      - {id: stop_fire, label: 冲进三号仓阻止纵火, tags: [disrupt, resolve], minutes: 15, vars: {saved: 2}}
    outcomes:
      - id: prevented
        title: 纵火被阻止
        when: 'event.vars.saved >= 2'
        text: 火在烧到木梁之前就被扑灭了，煤烟帮的人丢下油桶跑了。
      - id: warehouse_burned
        title: 三号仓烧毁
        default: true
        text: 三号仓烧了一整夜，煤烟帮第二天就以“维持治安”为名接管了码头。
        effects:
          - effect: {type: flag_set, values: {flag: dock_burned}}
