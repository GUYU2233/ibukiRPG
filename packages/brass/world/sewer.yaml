description: >
  潮湿的砖砌拱道里，粗大的蒸汽管道沿墙延伸，时不时喷出一股白雾。积水里漂着油花，深处传来沉重的脚步声。
short: 蒸汽管道嘶嘶作响，深处有沉重的脚步声。
