  - to: brass:location/plaza
    label: 钟楼广场
    minutes: 10
scene_facts:
  - 墙上有新鲜的爪痕
search:
  success: 你在一截断管后面发现拾荒者丢下的营火，灰还是温的——他们刚离开不久。
  failure: 积水太深，你摸索了半天，只摸到滑腻的青苔。
