description: >
  运煤驳船挤在北码头的木桩之间，吊臂吱呀作响。三号仓的铁门上刷着煤烟帮的黑手印，门缝里飘出一股煤油味。
short: 驳船、吊臂和煤油味——三号仓的铁门上有一只黑手印。
