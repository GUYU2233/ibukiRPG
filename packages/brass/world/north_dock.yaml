    label: 钟楼广场
    minutes: 15
scene_facts:
  - 三号仓门上刷着黑手印
  - 码头堆着成排的煤油桶
search:
  success: 你在三号仓外的煤堆里翻出一张被齿轮咬住的手的传单，背面写着“钟停之时，北码头”。
  failure: 码头工人瞪了你一眼：“看什么看？没活干就滚。”
