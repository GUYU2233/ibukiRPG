    demo:story/lost_purse:
      - 奥托涨红了脸：“就是她！那个弹琴的丫头，一直在我旁边转悠！我的钱袋里有十二枚银币！”
      - 奥托嚷嚷：“要是找不回来，我就去找镇上的治安官！”
  after_story:
    demo:story/lost_purse/truth:
      - 奥托不好意思地搓着手：“哎，都怪那只馋猫……这杯我请！”
