id: fog:character/su
type: character
identity:
  name: 苏
  age: 20
  role: 渔女
aliases: [苏, 渔女, 姑娘, 女孩]
location: fog:location/dock
description: 裹着褪色头巾的姑娘，手里攥着一截渔线，眼睛一直望着雾里的灯塔。
attributes:
  strength: 9
  agility: 12
  intelligence: 11
  resolve: 8
skills:
  insight: 10
personality:
  description: >
    安静、倔强，不爱和陌生人说话。
relationship_to_player:
  trust: 0
  fear: 0
dialogue:
  topics:
    sea: 海
    lighthouse: 灯塔
    letter: 信
    thanks: 道谢
    smalltalk: 家常
  lines:
    - id: after_delivered
      topic: thanks
      priority: 45
      once: true
      when: 'stories.letter.outcome == "delivered"'
      text: 苏把信贴在胸口，眼眶红红的：“谢谢你。等雾散了……我想去灯塔看看。”
      memory: 谢谢你送来的信，想去灯塔看看
    - id: sees_letter
      topic: letter
      priority: 40
      once: true
      when: '"letter_found" in world.flags && stories.letter.status == "active"'
      text: 你还没开口，苏就看见了你怀里露出的信封一角，手里的渔线“啪”地掉在栈道上。
      memory: 看见了你带来的信
    - id: first_greet
      topic: sea
      priority: 30
      once: true
      when: 'npc.talks == 0'
      text: 苏没有回头：“雾这么大，今天不会有船出海的。你要搭船，得等明天了。”
      memory: 告诉你今天不会有船出海
    - id: lighthouse
      topic: lighthouse
      priority: 25
      once: true
      when: 'npc.talks >= 1'
      text: 苏望着那点微弱的光：“刚才你问我等什么……我在等灯塔那边的消息。等了很多年了。”
      memory: 说自己多年来一直在等灯塔的消息
    - id: small
      topic: smalltalk
      priority: 1
      text: 苏把渔线绕在指头上，一圈又一圈，没有说话。
      memory: 沉默地绕着渔线
  repeat:
    - 苏低声说：“{topic}……我刚才都说了。”
  callback:
    - 苏看了你一眼：“刚才你{what}，我看见了。”
secrets: []
tags: [npc]
